name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Remove stale test report
        shell: pwsh
        run: |
          if (Test-Path test_reports/latest_test_report.md) {
            Remove-Item test_reports/latest_test_report.md -Force
          }

      - name: Run baseline audit
        run: python tools/run_test_audit.py

      - name: Show test report
        if: always()
        shell: pwsh
        run: |
          if (Test-Path test_reports/latest_test_report.md) {
            Get-Content test_reports/latest_test_report.md
          } else {
            Write-Host "test_reports/latest_test_report.md not found"
          }

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test_reports/latest_test_report.md
          if-no-files-found: warn
