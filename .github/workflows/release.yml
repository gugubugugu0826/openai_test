name: Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run baseline audit
        run: python tools/run_test_audit.py

      - name: Build release folder
        run: python build_release.py

      - name: Package release zip
        run: python tools/package_release_zip.py

      - name: Upload release artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            QwenDesktopAgent_v*.zip
            QwenDesktopAgent_v*
            test_reports/latest_test_report.md
          if-no-files-found: warn

      - name: Publish GitHub Release Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            QwenDesktopAgent_v*.zip
            test_reports/latest_test_report.md
