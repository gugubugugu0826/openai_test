name: Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-2025
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Remove stale test report
        shell: pwsh
        run: |
          if (Test-Path test_reports/latest_test_report.md) {
            Remove-Item test_reports/latest_test_report.md -Force
          }

      - name: Run baseline audit
        run: python tools/run_test_audit.py

      - name: Validate tag matches APP_VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: python tools/check_release_tag.py

      - name: Show test report
        if: always()
        shell: pwsh
        run: |
          if (Test-Path test_reports/latest_test_report.md) {
            Get-Content test_reports/latest_test_report.md
          } else {
            Write-Host "test_reports/latest_test_report.md not found"
          }

      - name: Build release folder
        run: python build_release.py

      - name: Package release zip
        run: python tools/package_release_zip.py

      - name: Generate release notes
        run: python tools/generate_release_notes.py

      - name: Generate release manifest
        run: python tools/generate_release_manifest.py

      - name: Write workflow summary
        if: always()
        shell: pwsh
        run: |
          if (Test-Path release_notes.md) {
            Get-Content release_notes.md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
          if (Test-Path release_manifest.md) {
            "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            Get-Content release_manifest.md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      - name: Upload release artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: release-artifacts
          path: |
            QwenDesktopAgent_v*.zip
            QwenDesktopAgent_v*
            test_reports/latest_test_report.md
            release_notes.md
            release_manifest.json
            release_manifest.md
          if-no-files-found: warn

      - name: Publish GitHub Release Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            QwenDesktopAgent_v*.zip
            test_reports/latest_test_report.md
            release_notes.md
            release_manifest.json
            release_manifest.md
